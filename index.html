<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>The CLB Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,300;125,500;125,800&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE The CLB itself: black studio, lime news bar, wide lowercase lines that mix light and bold
   IDEA the studio after dark: rings like stage lights over every location, cards like a crew wall
   PICTURE per-studio triple rings (count, stock, giveaways) that draw in and open a studio panel
   COLOUR black #0b0b0b / light #f5f5f5, CLB lime #d9e021, stage teal, soft coral for low
   TYPE Archivo expanded (stand-in for Graphite) + Inter Tight
   LAYOUT ticker, greeting, ring grid with panel, crew and instructor walls; phone gets a bottom tab bar */
:root{color-scheme:dark;--bg:#0b0b0b;--s1:#141414;--s2:#1f1f1f;--line:#2a2a2a;--edge:#363636;--track:#262626;--ink:#f5f5f5;--soft:#d9d9d9;--mute:#8e8e8e;--lime:#d9e021;--acc:#d9e021;--arcA:#d9e021;--teal:#4fb3a2;--low:#ff7a6b;--onlow:#000;--lowbg:#3a1c19;--okbg:#2a2d0c;--packed:#5d6115}
:root[data-theme=light]{color-scheme:light;--bg:#f5f5f5;--s1:#ffffff;--s2:#ededed;--line:#e3e3e3;--edge:#cfcfcf;--track:#e8e8e8;--ink:#0b0b0b;--soft:#333;--mute:#6b6b6b;--acc:#5c6100;--arcA:#b9c00c;--teal:#2c8a7b;--low:#c8372b;--onlow:#fff;--lowbg:#fde4e1;--okbg:#eef1bd;--packed:#d6da8a}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Inter Tight",system-ui,sans-serif;overflow-x:clip;transition:background .3s,color .3s}
h1,h2,h3{font-family:Archivo,"Arial Black",sans-serif;font-stretch:125%;font-weight:300;line-height:1.08;margin:0;letter-spacing:-.015em}
h1{font-size:clamp(28px,4.6vw,46px)}
h2{font-size:clamp(20px,2.6vw,28px)}
h3{font-size:18px;font-weight:500}
b,strong,h1 b,h2 b{font-weight:800}
a{color:var(--acc)}
button,input,select,textarea{font:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(4vw,16px,env(safe-area-inset-left));padding-right:max(4vw,16px,env(safe-area-inset-right))}
header{background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;gap:6px 18px;justify-content:space-between;padding-block:10px}
.mark{font-family:Archivo,sans-serif;font-stretch:125%;font-weight:800;font-size:22px;letter-spacing:-.02em;white-space:nowrap;color:var(--ink);text-decoration:none}
.mark span{font-weight:300;color:var(--soft)}
#nav{display:flex;gap:2px;overflow-x:auto}
#nav a{color:var(--soft);text-decoration:none;padding:10px 12px;font-weight:500;font-size:15px;white-space:nowrap;border-bottom:2px solid transparent;min-height:44px;display:inline-flex;align-items:center;gap:6px}
#nav .ico{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:99px;transition:background .25s,color .25s,transform .2s}
#nav .ico svg{width:19px;height:19px;overflow:visible}
#nav .ico svg *{transform-box:fill-box;transform-origin:center;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
#nav a:active .ico{transform:scale(.88)}
#nav a[aria-current=page] .ico{background:var(--lime);color:#000}
.ico-home .door{transform-origin:left bottom}
#nav a:hover .ico-home .door,#nav a[aria-current=page] .ico-home .door{transform:scaleX(.35)}
.ico-count .tick{stroke-dasharray:11;stroke-dashoffset:0}
#nav a:hover .ico-count .tick,#nav a[aria-current=page] .ico-count .tick{animation:draw .6s ease both}
@keyframes draw{from{stroke-dashoffset:11}to{stroke-dashoffset:0}}
.ico-restock .lid{transform-origin:center bottom}
#nav a:hover .ico-restock .lid,#nav a[aria-current=page] .ico-restock .lid{transform:translateY(-2.5px)}
.ico-giveaways .lid{transform-origin:left bottom}
#nav a:hover .ico-giveaways .lid,#nav a[aria-current=page] .ico-giveaways .lid{transform:translate(1px,-3px) rotate(-14deg)}
.ico-history .hand{transform-origin:12px 12px;transform-box:view-box}
#nav a:hover .ico-history .hand,#nav a[aria-current=page] .ico-history .hand{transform:rotate(360deg);transition-duration:.9s}
#nav a:hover .ico-settings .gear,#nav a[aria-current=page] .ico-settings .gear{transform:rotate(90deg);transition-duration:.7s}
.ic svg{transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.ic:active svg{transform:rotate(60deg) scale(.85)}
#nav a[aria-current=page]{color:var(--ink);font-weight:700}
.tools{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute);white-space:nowrap}
.live{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--soft)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.live.on i{background:#3ddc84;box-shadow:0 0 0 0 rgba(61,220,132,.6);animation:pulse 2s infinite}
.live.off i{background:var(--low)}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
.ic{width:36px;height:36px;border-radius:50%;border:1px solid var(--edge);background:none;display:grid;place-items:center;color:var(--ink);padding:0}
.mode{padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--soft);font-weight:600}
.mode.bold{background:var(--lime);border-color:var(--lime);color:#000}
.who button{background:none;border:0;color:var(--soft);text-decoration:underline;font-size:13px;padding:6px}
.ticker{background:var(--lime);color:#000;overflow:hidden;position:relative;white-space:nowrap;border-bottom:1px solid #000}
.ticker .tr{display:inline-flex;padding-block:11px;animation:tick var(--dur,30s) linear infinite;will-change:transform}
.ticker:hover .tr,.ticker.paused .tr{animation-play-state:paused}
.ticker a,.ticker span.t{color:#000;text-decoration:none;font-weight:600;font-size:15px;padding:0 22px}
.ticker a:hover{text-decoration:underline}
.ticker em{font-style:normal;font-weight:800;font-family:Archivo,sans-serif;font-stretch:125%;font-size:12px;letter-spacing:.02em;margin-right:8px;padding:2px 7px;border-radius:4px;background:#000;color:var(--lime)}
.ticker small{font-weight:500;opacity:.65;margin-left:6px}
.ticker .sep{opacity:.5}
.ticker .tr>div{display:inline-block;white-space:nowrap}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
main{padding-block:26px 70px;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.head{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end;justify-content:space-between}
.sub{color:var(--mute);margin:8px 0 0;font-size:15px}
section+section,.sec{margin-top:44px}
.sech{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:baseline;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:18px}
.btn{min-height:44px;padding:9px 18px;border-radius:99px;border:1px solid var(--edge);background:transparent;font-weight:600;color:var(--ink);transition:transform .15s,border-color .15s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--soft)}
.btn:active{transform:scale(.97)}
.btn.lime{background:var(--lime);border-color:var(--lime);color:#000}
.btn.sm{min-height:36px;padding:4px 14px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
select,input[type=text],input[type=date],input[type=month],input[type=number],input[type=password],textarea{min-height:44px;padding:8px 12px;border:1px solid var(--edge);border-radius:10px;background:var(--s1)}
textarea{min-height:80px;width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.c-low{background:var(--lowbg);color:var(--low)}
.c-ok{background:var(--okbg);color:var(--acc)}
.c-dim{border:1px solid var(--line);color:var(--mute)}
.rings{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.rings.one{grid-template-columns:minmax(0,240px)}
.rc{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:16px 14px 14px;display:grid;gap:10px;justify-items:center;color:var(--ink);transition:transform .2s,border-color .2s}
.rc:hover{transform:translateY(-3px);border-color:var(--edge)}
.rc[aria-pressed=true]{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime) inset}
.rc svg{width:min(130px,100%);height:auto;overflow:visible}
.rc circle{fill:none;stroke-width:9;stroke-linecap:round}
.rc .tk{stroke:var(--track)}
.rc .arc{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1),stroke-width .2s}
.rc .arc:hover{stroke-width:12}
.rc .nm{font-family:Archivo,sans-serif;font-stretch:125%;font-weight:800;font-size:16px;justify-self:stretch;text-align:center}
.rc .nm small{display:block;font-family:"Inter Tight";font-weight:500;font-size:13px;color:var(--mute)}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--soft)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:14px;animation:fade .3s ease}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.stat{border-left:2px solid var(--c);padding-left:14px}
.stat .v{font-family:Archivo,sans-serif;font-stretch:125%;font-weight:800;font-size:clamp(24px,3vw,30px);line-height:1.1}
.stat .l{color:var(--mute);font-size:14px}
.list{margin:10px 0 0;padding:0;list-style:none;font-size:14px;color:var(--soft)}
.list li{padding:5px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:4px;position:relative;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px) rotate(-.4deg);border-color:var(--edge)}
.card .top2{display:flex;align-items:center;gap:12px}
.card .em{font-size:38px;line-height:1;display:inline-block;transition:transform .3s}
.card:hover .em{transform:scale(1.2) rotate(-8deg)}
.card .ph{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--lime)}
.card .ph+.em{font-size:26px;margin-left:-26px;margin-top:38px}
.card .nm{font-family:Archivo,sans-serif;font-stretch:125%;font-weight:800;font-size:18px;margin-top:8px}
.card .rl{color:var(--acc);font-weight:600;font-size:14px}
.card dl{margin:10px 0 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;font-size:14px}
.card dt{color:var(--mute)}
.card dd{margin:0;color:var(--soft);overflow-wrap:anywhere}
.card .bday{position:absolute;top:14px;right:14px}
.card .ed{position:absolute;bottom:10px;right:10px;background:none;border:0;color:var(--mute);font-size:13px;text-decoration:underline;min-height:36px;padding:4px 8px}
.add{border:1px dashed var(--edge);background:transparent;border-radius:18px;min-height:180px;color:var(--soft);font-weight:600;display:grid;place-items:center;gap:6px;transition:border-color .2s}
.add:hover{border-color:var(--lime)}
.add span{font-size:30px;color:var(--acc);line-height:1}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(13em,1fr));gap:12px;margin-top:12px}
.form label,.form .lb{display:grid;gap:4px;font-size:14px;font-weight:600;color:var(--soft)}
.full{grid-column:1/-1}
.emo{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px;max-height:200px;overflow-y:auto;padding:6px;border:1px solid var(--edge);border-radius:12px;background:var(--bg)}
.emo button{border:0;background:none;font-size:24px;height:44px;border-radius:10px;transition:transform .15s}
.emo button:hover{transform:scale(1.2)}
.emo button[aria-pressed=true]{background:var(--lime)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--edge);border-radius:99px;padding:6px 12px;font-weight:600;min-height:40px;cursor:pointer}
.checks input{accent-color:var(--lime)}
.phrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.phrow img{width:64px;height:64px;border-radius:50%;object-fit:cover}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.msg{padding:12px 16px;border-radius:12px;font-weight:600;margin-top:12px}
.m-ok{background:var(--okbg);color:var(--acc)}
.m-bad{background:var(--lowbg);color:var(--low)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--mute);font-weight:600}
.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.heat td.h{text-align:center;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.h-out{background:var(--low);color:var(--onlow)}
.h-low{background:var(--lowbg);color:var(--low)}
.h-dim{color:var(--mute);opacity:.6;font-weight:400!important}
.jump{display:flex;gap:6px;overflow-x:auto;margin-top:16px;padding-bottom:2px}
.jump a{flex:none;border:1px solid var(--edge);border-radius:99px;padding:6px 14px;color:var(--soft);text-decoration:none;font-weight:600;font-size:14px;min-height:38px;display:inline-flex;align-items:center;gap:6px}
.jump a b{font-variant-numeric:tabular-nums;color:var(--mute);font-weight:600}
.jump a.done{border-color:var(--lime)}
.grp{scroll-margin-top:90px}
.grp>h3{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:20px 0 8px;border-bottom:1px solid var(--soft)}
.grp>h3 span{font-family:"Inter Tight";font-size:13px;color:var(--mute);font-weight:500}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);transition:background .3s}
.item.flash{background:color-mix(in srgb,var(--lime) 14%,transparent)}
.item .nm{font-weight:600;line-height:1.3}
.item .nm small{display:block;color:var(--mute);font-weight:400;font-size:13px}
.step{display:flex;align-items:center;border:1px solid var(--edge);border-radius:12px;overflow:hidden;background:var(--s1)}
.step button{width:44px;height:44px;border:0;background:var(--s2);font-size:20px;font-weight:700;color:var(--ink);touch-action:manipulation}
.step button:active{background:var(--lime);color:#000}
.step input{width:56px;border:0;border-radius:0;text-align:center;font-variant-numeric:tabular-nums;font-weight:700;padding:8px 2px;background:var(--s1)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none;transition:background .3s}
.d-ok{background:var(--lime)}.d-low{background:var(--low)}.d-none{background:var(--edge)}
.item.todo .nm{color:var(--mute)}
.extra{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:14px;color:var(--mute)}
.extra label{display:inline-flex;align-items:center;gap:6px;min-height:36px}
.extra input[type=text]{min-height:40px;font-size:16px;flex:1 1 200px}
.bar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 0;margin-top:20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;z-index:5}
.meter{height:6px;border-radius:99px;background:var(--track);overflow:hidden;flex:1 1 120px;max-width:300px}
.meter i{display:block;height:100%;background:var(--lime);transition:width .4s}
.ev{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:14px}
.bags{display:flex;flex-wrap:wrap;gap:3px;margin:14px 0}
.bags i{width:10px;height:14px;border-radius:2px;background:var(--track);transition:background .3s}
.bags i.p{background:var(--packed)}
.bags i.g{background:var(--lime)}
.need{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:6px 16px;font-size:15px;align-items:center}
.recipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(14em,1fr));gap:8px;margin-top:10px}
.recipe label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px;border:1px solid var(--line);border-radius:10px;padding:4px 4px 4px 12px}
.recipe input{width:72px;text-align:center}
.empty{padding:28px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:18px}
.gate{max-width:480px;margin:6vh auto 0;display:grid;gap:16px}
.gate h1{font-size:clamp(36px,9vw,54px)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--edge);border-radius:99px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:99px;min-height:40px;font-weight:600;color:var(--soft);transition:background .2s}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.gate label{display:grid;gap:4px;font-weight:600;font-size:14px;color:var(--soft)}
.note{font-size:13px;color:var(--mute);margin-top:34px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.tabs button{border:1px solid var(--edge);background:none;border-radius:99px;padding:6px 14px;min-height:38px;color:var(--soft);font-weight:600;font-size:14px}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.boom{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.boom i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall 1.4s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}

/* ===== LIVE LAYER ===== */
#amb{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#amb i{position:absolute;top:-30vh;width:38vw;min-width:280px;height:150vh;border-radius:50%;opacity:var(--ao,.55);will-change:transform}
#amb i:nth-child(1){left:8%;background:radial-gradient(ellipse at 50% 0,rgba(79,179,162,.22),transparent 62%);transform-origin:50% 0;animation:sway 14s ease-in-out infinite alternate}
#amb i:nth-child(2){left:52%;background:radial-gradient(ellipse at 50% 0,rgba(217,224,33,.11),transparent 60%);transform-origin:50% 0;animation:sway 18s ease-in-out -6s infinite alternate-reverse}
#amb i:nth-child(3){left:-10%;top:55vh;width:120vw;height:60vh;background:radial-gradient(ellipse at 50% 50%,rgba(245,245,245,.045),transparent 65%);animation:haze 22s ease-in-out infinite alternate}
:root[data-theme=light] #amb{--ao:.35}
@keyframes sway{from{transform:rotate(-13deg)}to{transform:rotate(13deg)}}
@keyframes haze{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
body{background:var(--bg)}
html{background:var(--bg)}
header{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.rv{opacity:0;transform:translateY(16px);transition:opacity .55s ease var(--dl,0s),transform .65s cubic-bezier(.2,.8,.2,1) var(--dl,0s)}
.rv.in{opacity:1;transform:none}
h1 .w{display:inline-block;opacity:0;transform:translateY(.45em);animation:wIn .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*90ms)}
@keyframes wIn{to{opacity:1;transform:none}}
.tilt{transform-style:preserve-3d;will-change:transform}
.tilt.hov{transition:transform .08s linear,border-color .2s;transform:perspective(700px) rotateX(var(--rx,0)) rotateY(var(--ry,0)) translateY(-3px)}
.rc,.card{background-image:radial-gradient(240px circle at var(--mx,50%) var(--my,-40%),rgba(217,224,33,.10),transparent 60%)}
.rc.hov svg .arc{filter:drop-shadow(0 0 6px rgba(217,224,33,.35))}
.btn,.step button,.rc,.add,.jump a,.tabs button,.seg button,#nav a{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.25;pointer-events:none;animation:rip .55s ease-out forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}
.btn.lime:hover{box-shadow:0 0 0 4px color-mix(in srgb,var(--lime) 25%,transparent)}
.btn.lime.ready{animation:ready 1.6s ease-in-out infinite}
@keyframes ready{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--lime) 22%,transparent)}}
.bump{animation:bump .35s cubic-bezier(.3,1.8,.5,1)}

}

</div></header>

<main class="wrap" id="app"><p class="sub">Loading…</p></main>

<script>
{
/* ================= CONFIG ================= */
const FIREBASE_CONFIG = null; /* paste the Firebase web config object here to go live */
const START_WEEK = '2027-W01'; /* counting starts Monday 4 January 2027 */
const DEFAULT_BOLD = 'boldly2027'; /* Bold Mode password until changed in Settings */
const DEFAULT_MGR = id => id + '2027'; /* manager password per studio until changed, e.g. oost2027 */

/* ================= CATALOGUE (from the CLB stock sheet) ================= */
const SECT=[['stock','Stock','Back-of-house supply'],['merch','Merchandise','For sale and giveaways'],['vending','Vending','Vending machine'],['room','In the room','On the studio floor']];
const SEED_ITEMS=[
['s_bl','stock','Resistance band light','pcs',20],['s_bm','stock','Resistance band medium','pcs',20],['s_bh','stock','Resistance band heavy','pcs',20],['s_aw','stock','Ankle weights (loose, not per pack)','pcs',10],['s_eb','stock','Exercise balls','pcs',5],['s_ep','stock','Earplugs','boxes',2,'https://oordopjes-kopen.nl/p/box-200-paar-ear-soft-fx/'],['s_ht','stock','Hair ties','pcs',50,'https://www.bol.com/nl/nl/p/fako-fashion-haarelastiekjes-o-45mm-4mm-dik-100-stuks-zwart/9300000139451158/'],['s_hz','stock','Hazer fluid','cans',4,'https://www.fritz-events.nl/look-vl-unique-hazervloeistof-2-liter.html'],['s_fs','stock','Extra floor stickers','pcs',5],['s_lb','stock','Light bulbs','pcs',5],
['m_ts','merch','T-shirts','pcs',4],['m_so','merch','The CLB socks','pairs',5],['m_wb','merch','Water bottles','pcs',3],['m_tb','merch','Tote bags','pcs',4],
['v_so','vending','Socks','pairs',30],['v_ns','vending','Not Just Salt','pcs',8],['v_lk','vending','Locks','pcs',4],['v_tb','vending','Tote bags','pcs',8],['v_mw','vending','Marie water','bottles',8],
['r_bl','room','Resistance band light','pcs',35],['r_bm','room','Resistance band medium','pcs',35],['r_bh','room','Resistance band heavy','pcs',35],['r_aw','room','Ankle weights (loose, not per pack)','pcs',62],['r_eb','room','Exercise balls','pcs',32],['r_ep','room','Earplugs','pairs',10],['r_ht','room','Hair ties','pcs',10],['r_mt','room','Mats','pcs',32],['r_sb','room','Spray bottles','pcs',10,'https://www.neweco.nl/sprayflacon-600ml-zwart.html'],['r_fs','room','Floor stickers','pcs',30]
].map(a=>({id:a[0],sec:a[1],name:a[2],unit:a[3],par:a[4],link:a[5]||''}));
const NOVEND=['v_so','v_ns','v_lk','v_tb','v_mw'];
const SEED_STUDIOS=[
{id:'oost',name:'Oost',city:'Amsterdam',par:{},off:NOVEND},
{id:'singel',name:'Singel',city:'Amsterdam',par:{r_aw:70,r_eb:34,r_mt:34,r_fs:34},off:['m_wb']},
{id:'hag',name:'Den Haag',city:'Den Haag',par:{s_eb:10},off:NOVEND},
{id:'rtm',name:'Coolsingel',city:'Rotterdam',par:{r_aw:66,r_fs:32},off:NOVEND},
{id:'utr',name:'Janskerkhof',city:'Utrecht',par:{},off:NOVEND},
{id:'ldn',name:'Westfield',city:'London',par:{},off:NOVEND}];
const ROOMFROM={r_bl:'s_bl',r_bm:'s_bm',r_bh:'s_bh',r_aw:'s_aw',r_eb:'s_eb',r_ht:'s_ht',r_fs:'s_fs'};
const GIFT_SECS=['merch','vending','stock'];

/* ================= HELPERS ================= */
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash=s=>{let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return(h>>>0).toString(36);};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const isoWeek=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();return{y,w:Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7)};};
const keyOf=d=>{const{y,w}=isoWeek(d);return y+'-W'+String(w).padStart(2,'0');};
const monOf=k=>{const[y,w]=k.split('-W').map(Number);const j=new Date(y,0,4,12);j.setDate(j.getDate()-((j.getDay()||7)-1)+(w-1)*7);return j;};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const fd=(d,o)=>d.toLocaleDateString('en-GB',o||{day:'numeric',month:'short'});
const wkNum=k=>+k.split('-W')[1];
const wkName=k=>'Week '+wkNum(k)+(k.slice(0,4)!=='2027'?' '+k.slice(0,4):'');
const wkRange=k=>{const m=monOf(k);return fd(m)+' – '+fd(addD(m,6));};
const prevKey=k=>keyOf(addD(monOf(k),-7));
const NOW=new Date();const TODAY=iso(NOW);const DOW=NOW.getDay();
const OPEN=keyOf(NOW)>=START_WEEK;
const CUR=OPEN?keyOf(NOW):START_WEEK;
const when=s=>s?new Date(s).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
const stamp=()=>new Date().toISOString();
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ================= STORAGE ================= */
const LIVE=!!(FIREBASE_CONFIG&&window.firebase);
let db=null;
const L={get:k=>{try{return JSON.parse(localStorage.getItem('clbhub.'+k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem('clbhub.'+k,JSON.stringify(v))}catch(e){}}};
const COLS=['counts','events','posts','people'];
const D={cat:null,access:null,counts:{},events:{},posts:{},people:{},ready:0};
const listeners=[];const changed=()=>listeners.forEach(f=>f());
const seedAccess=()=>({bold:hash(DEFAULT_BOLD),mgr:Object.fromEntries(SEED_STUDIOS.map(s=>[s.id,hash(DEFAULT_MGR(s.id))]))});
async function start(){
 if(LIVE){
  firebase.initializeApp(FIREBASE_CONFIG);await firebase.auth().signInAnonymously();db=firebase.firestore();try{await db.enablePersistence({synchronizeTabs:true})}catch(e){}
  const cr=db.collection('config').doc('catalog'),ar=db.collection('config').doc('access');
  if(!(await cr.get()).exists)await cr.set({items:SEED_ITEMS,studios:SEED_STUDIOS});
  if(!(await ar.get()).exists)await ar.set(seedAccess());
  const once=f=>{let s=0;return x=>{f(x);if(!s){s=1;D.ready++;}changed();};};
  cr.onSnapshot(once(s=>D.cat=s.data()));ar.onSnapshot(once(s=>D.access=s.data()));
  for(const c of COLS)db.collection(c).onSnapshot(once(q=>{D[c]={};q.forEach(d=>D[c][d.id]=d.data());}));
 }else{
  D.cat=L.get('cat')||{items:SEED_ITEMS,studios:SEED_STUDIOS};D.access=L.get('access')||seedAccess();
  for(const c of COLS)D[c]=L.get(c)||{};D.ready=2+COLS.length;changed();
 }
}
async function put(col,id,data){
 if(LIVE){const w=db.collection(col).doc(id).set(data,{merge:true});if(navigator.onLine)await w;else w.catch(()=>{});return;}
 if(col==='config'){const k=id==='catalog'?'cat':'access';D[k]={...D[k],...data};L.set(k,D[k]);}
 else{D[col][id]={...(D[col][id]||{}),...data};L.set(col,D[col]);}
 changed();
}
async function del(col,id){if(LIVE){await db.collection(col).doc(id).delete();return;}delete D[col][id];L.set(col,D[col]);changed();}

/* ================= DATA HELPERS ================= */
const studios=()=>D.cat.studios;const SX=id=>studios().find(s=>s.id===id);
const IX=id=>D.cat.items.find(i=>i.id===id);
const itemsFor=s=>D.cat.items.filter(i=>!(s.off||[]).includes(i.id));
const lvl=(s,i)=>s.par?.[i.id]??i.par;
const full=s=>!s?'':s.city===s.name?s.name:s.city+' '+s.name;
const countsOf=sid=>Object.values(D.counts).filter(c=>c.studio===sid&&c.submitted).sort((a,b)=>b.week.localeCompare(a.week));
const latest=sid=>countsOf(sid)[0]||null;
const counted=(sid,k)=>!!D.counts[sid+'_'+k]?.submitted;
const packedSince=(sid,item,at)=>Object.values(D.events).filter(e=>e.studio===sid&&e.packedAt&&(!at||e.packedAt>at)).reduce((a,e)=>a+(e.recipe[item]||0)*e.bags,0);
const avail=(sid,item)=>{const c=latest(sid);if(!c||c.v[item]==null)return null;return Math.max(0,c.v[item]-packedSince(sid,item,c.at));};
const lowOf=s=>{const c=latest(s.id);if(!c)return null;return itemsFor(s).filter(i=>(c.v[i.id]??0)<lvl(s,i));};
const evsOf=sid=>Object.entries(D.events).map(([id,e])=>({id,...e})).filter(e=>!sid||e.studio===sid);
const activeEvs=sid=>evsOf(sid).filter(e=>e.date>=iso(addD(NOW,-14)));
const ringData=s=>{const c=latest(s.id);const its=itemsFor(s);const low=lowOf(s);const ev=activeEvs(s.id);const bags=ev.reduce((a,e)=>a+e.bags,0);const given=ev.reduce((a,e)=>a+(e.rec||[]).filter(r=>r.given).length,0);
 return{count:counted(s.id,CUR)?1:0,stock:c?1-low.length/its.length:0,give:bags?given/bags:0,hasCount:!!c,low:low||[],bags,given,ev};};

/* ================= ACCESS ================= */
let me=L.get('me');
const isBold=()=>me?.mode==='bold';const isMgr=()=>me?.mode==='manager';
const myStudios=()=>isBold()?studios():studios().filter(s=>s.id===me.studio);
const canSee=sid=>isBold()||sid===me.studio;
const MODE_LBL={host:'Host',manager:'Manager',bold:'Bold'};

/* ================= SHELL ================= */
const app=document.getElementById('app'),nav=document.getElementById('nav'),who=document.getElementById('who'),ban=document.getElementById('banner');
const ICO={
home:'<path d="M3 11l9-7 9 7"/><path d="M5 9.5V20h14V9.5"/><path class="door" d="M10 20v-5h4v5"/>',
count:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9z"/><path class="tick" d="M9 13.5l2 2 4-4.5"/>',
restock:'<path class="lid" d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7M12 11v10"/>',
giveaways:'<g class="lid"><path d="M3 8h18v4H3z"/><path d="M12 8c-2-4-6-4-6-1s6 1 6 1zm0 0c2-4 6-4 6-1s-6 1-6 1z"/></g><path d="M5 12h14v9H5zM12 12v9"/>',
history:'<circle cx="12" cy="12" r="8.5"/><path class="hand" d="M12 7.5V12l3 2"/>',
settings:'<g class="gear"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/><circle cx="12" cy="12" r="6.5"/></g>'};
const svgI=k=>`<span class="ico ico-${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO[k]}</svg></span>`;
const NAV=[['home','Home'],['count','Count'],['restock','Restock'],['giveaways','Giveaways'],['history','History'],['settings','Settings',()=>!me||me.mode!=='host']];
function shell(v){
 nav.innerHTML=me?NAV.filter(n=>!n[2]||n[2]()).map(n=>`<a href="#${n[0]}"${n[0]===v?' aria-current="page"':''}>${svgI(n[0])}${n[1]}</a>`).join(''):'';
 who.innerHTML=me?`<span class="mode${isBold()?' bold':''}">${MODE_LBL[me.mode]}</span><span class="nmw">${esc(me.name)}${isBold()?'':' · '+esc(SX(me.studio)?.name)}</span><button id="out">Switch</button>`:'';
}
who.addEventListener('click',e=>{if(e.target.id==='out'){me=null;L.set('me',null);location.hash='';route();}});

/* ================= NEWS TICKER ================= */
function banMsgs(){
 const m=[];const wk=DOW===6||DOW===0;
 for(const[id,p]of Object.entries(D.posts).sort((a,b)=>b[1].at.localeCompare(a[1].at))){if(p.until&&p.until<TODAY)continue;if(!isBold()&&p.to?.length&&!p.to.includes(me.studio))continue;m.push({tag:'CLB',t:p.text,from:p.from});}
 for(const e of evsOf().filter(e=>canSee(e.studio)&&e.date>=TODAY&&e.date<=iso(addD(NOW,3))).sort((a,b)=>a.date.localeCompare(b.date))){const d=e.date===TODAY?'today':fd(new Date(e.date+'T12:00'),{weekday:'long'});m.push({tag:'GIVEAWAY',t:`${e.name}${isBold()?' · '+full(SX(e.studio)):''} is ${e.date===TODAY?'':'on '}${d}. ${e.packedAt?'Bags are packed.':e.bags+' bags still to pack.'}`,go:'giveaways'});}
 for(const s of myStudios()){
  if(OPEN&&!counted(s.id,CUR)&&wk)m.push({tag:'COUNT',t:`${wkName(CUR)} count${isBold()?' at '+full(s):''} is due by Sunday.`,go:'count'});
  const pk=prevKey(CUR);if(OPEN&&pk>=START_WEEK&&!counted(s.id,pk))m.push({tag:'MISSED',t:`${wkName(pk)}${isBold()?' at '+full(s):''} was not counted.`,go:'count'});
 }
 if(!OPEN)m.push({tag:'COUNT',t:`Counting starts ${wkName(START_WEEK)}, Monday ${fd(monOf(START_WEEK),{day:'numeric',month:'long'})}.`,go:'count'});
 return m;
}
let banSig='';
function banner(){
 if(!me){ban.hidden=true;banSig='';return;}
 const m=banMsgs();if(!m.length){ban.hidden=true;banSig='';return;}
 const one=x=>`${x.go?`<a href="#${x.go}">`:'<span class="t">'}<em>${x.tag}</em>${esc(x.t)}${x.from?`<small>${esc(x.from)}</small>`:''}${x.go?'</a>':'</span>'}<span class="sep" aria-hidden="true">✦</span>`;
 const run=m.map(one).join('');let rep=run;while(rep.length<1400)rep+=run;
 const sig=JSON.stringify(m);if(sig===banSig&&!ban.hidden)return;banSig=sig;
 const len=m.reduce((a,x)=>a+x.t.length,0)*Math.ceil(rep.length/run.length);
 ban.hidden=false;
 ban.innerHTML=`<div class="tr" style="--dur:${Math.max(18,Math.round(len*0.2))}s"><div class="seg1">${rep}</div><div class="dup" aria-hidden="true">${rep}</div></div>`;
 ban.setAttribute('aria-label',m.map(x=>x.t).join(' · '));
}
ban.addEventListener('touchstart',()=>ban.classList.toggle('paused'),{passive:true});

/* ================= THEME + LIVE ================= */
const thBtn=document.getElementById('theme'),liveEl=document.getElementById('live');
const SUN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>';
function paintTheme(){const t=document.documentElement.dataset.theme;thBtn.innerHTML=t==='dark'?SUN:MOON;document.querySelector('meta[name=theme-color]').content=t==='dark'?'#0b0b0b':'#f5f5f5';}
thBtn.onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('clbhub.theme',t)}catch(e){}paintTheme();};
paintTheme();
function paintLive(){const on=navigator.onLine;liveEl.className='live'+(LIVE?(on?' on':' off'):'');liveEl.querySelector('span').textContent=LIVE?(on?'Live':'Offline · saves when back'):'Preview';liveEl.title=LIVE?(on?'Connected. Changes are shared with every studio.':'No connection. Your changes are kept and sync when you are back online.'):'Preview mode: saved in this browser only.';}
addEventListener('online',paintLive);addEventListener('offline',paintLive);paintLive();

/* ================= GATE ================= */
let gMode='host';
function gate(err){

 if(window.sGo)sGo.onclick=async()=>{const par={},off=[];app.querySelectorAll('[data-par]').forEach(x=>{const i=IX(x.dataset.par),v=Math.max(0,+x.value||0);if(v!==i.par)par[i.id]=v;});app.querySelectorAll('[data-on]').forEach(x=>{if(!x.checked)off.push(x.dataset.on);});await put('config','catalog',{studios:studios().map(x=>x.id===setS?{...x,par,off}:x)});ok('Levels saved. Restock uses them straight away.');};
 if(window.aGo)aGo.onclick=async()=>{const n=aN.value.trim();if(!n)return;await put('config','catalog',{items:[...D.cat.items,{id:aS.value[0]+'_'+uid(),sec:aS.value,name:n,unit:aU.value.trim()||'pcs',par:Math.max(0,+aP.value||0),link:aL.value.trim()}]});ok('Product added for all studios.');};
 if(window.nGo)nGo.onclick=async()=>{const n=nN.value.trim(),c=nC.value.trim(),p=nP.value.trim();if(!n||!c||p.length<4)return;const id=(c+'-'+n).toLowerCase().replace(/[^a-z0-9]+/g,'-');await put('config','catalog',{studios:[...studios(),{id,name:n,city:c,par:{},off:NOVEND}]});await put('config','access',{mgr:{...D.access.mgr,[id]:hash(p)}});ok('Studio added.');};
 if(window.pGo)pGo.onclick=async()=>{const v=pV.value.trim();if(v.length<4)return;const w=isBold()?pW.value:me.studio;if(w==='bold')await put('config','access',{bold:hash(v)});else await put('config','access',{mgr:{...D.access.mgr,[w]:hash(v)}});ok('Password changed.');};
}

/* ================= ROUTER ================= */
const V={home:vHome,count:vCount,restock:vRestock,giveaways:vGive,history:vHistory,settings:vSettings};
let cur='';
function route(){
 if(!D.cat)return;app.onclick=null;app.onkeydown=null;
 if(!me||(me.mode!=='bold'&&!SX(me.studio))){me=null;cur='';return gate();}
 let v=location.hash.slice(1);if(!V[v])v='home';cur=v;shell(v);banner();V[v]();
 if(!LIVE)app.insertAdjacentHTML('beforeend','<p class="note">Preview: data is saved in this browser only until Firebase is connected.</p>');
 enhance();
}
const RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
let io=null;
function enhance(){
 const h1=app.querySelector('h1');if(h1&&!RM()&&!h1.dataset.sp){h1.dataset.sp=1;let i=0;const walk=n=>{[...n.childNodes].forEach(c=>{if(c.nodeType===3){const f=document.createDocumentFragment();c.textContent.split(/(\s+)/).forEach(t=>{if(!t)return;if(/^\s+$/.test(t)){f.append(t);return;}const s=document.createElement('span');s.className='w';s.style.setProperty('--i',i++);s.textContent=t;f.append(s);});c.replaceWith(f);}else if(c.nodeType===1&&c.tagName!=='SPAN')walk(c);});};walk(h1);}
 const els=app.querySelectorAll('.rc,.card,.add,.ev,.panel:not(#cf):not(#pfm),.sech,.grp,.sec,.empty,.stack tbody tr,.heat tbody tr');
 if(RM()||!('IntersectionObserver' in window)){return;}
 io?.disconnect();io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{rootMargin:'0px 0px -5% 0px'});
 let k=0;els.forEach(el=>{if(el.closest('#cB'))return;el.classList.add('rv');el.style.setProperty('--dl',(Math.min(k++,10)*45)+'ms');io.observe(el);});
 app.querySelectorAll('.rc,.card').forEach(el=>el.classList.add('tilt'));
}
/* pointer tilt + glow */
app.addEventListener('pointermove',e=>{if(RM()||e.pointerType==='touch')return;const t=e.target.closest('.tilt');if(!t)return;const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;t.classList.add('hov');t.style.setProperty('--rx',((.5-y)*8).toFixed(2)+'deg');t.style.setProperty('--ry',((x-.5)*8).toFixed(2)+'deg');t.style.setProperty('--mx',(x*100).toFixed(1)+'%');t.style.setProperty('--my',(y*100).toFixed(1)+'%');});
app.addEventListener('pointerout',e=>{const t=e.target.closest('.tilt');if(t&&!t.contains(e.relatedTarget)){t.classList.remove('hov');t.style.removeProperty('--my');}});
/* ripple */
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn,.step button,.rc,.add,.jump a,.tabs button,.seg button,#nav a');if(!b||RM())return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2.2;const s=document.createElement('span');s.className='rip';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),600);if(e.pointerType==='touch')buzz();});
const busy=()=>{const a=document.activeElement;return a&&app.contains(a)&&a.matches('input,select,textarea');};
let booted=false;
listeners.push(()=>{if(!booted){if(!(D.cat&&D.access&&D.ready>=2+COLS.length))return;booted=true;route();return;}if(!me||cur==='count'||cur==='settings'||busy()||cardForm)return;route();});
addEventListener('hashchange',()=>{if(location.hash==='#count')draft=null;route();});
start().catch(err=>{app.innerHTML='<div class="msg m-bad">Couldn’t connect to the database. Check the connection and refresh.</div>';console.error(err);});
}
</script>
